<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';">
  <title>File Explorer</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body data-theme="light">
  <div id="win">
    <div id="titlebar">
      <div id="tabstrip"></div>
      <div id="titleSpacer" class="drag-region"></div>
      <div id="wctl">
        <button id="wMin" class="wbtn" title="Minimize"></button>
        <button id="wMax" class="wbtn" title="Maximize"></button>
        <button id="wClose" class="wbtn close" title="Close"></button>
      </div>
    </div>

    <div id="addrbar">
      <button id="btnBack" class="navbtn" title="Back (Alt+Left)"></button>
      <button id="btnFwd" class="navbtn" title="Forward (Alt+Right)"></button>
      <button id="btnUp" class="navbtn" title="Up (Alt+Up)"></button>
      <button id="btnRefresh" class="navbtn small" title="Refresh (F5)"></button>
      <div id="addr" class="field" title="Address bar (Ctrl+L)"></div>
      <div id="search" class="field">
        <span class="s-ico"></span>
        <input id="searchInput" type="text" spellcheck="false" autocomplete="off">
        <button id="searchClear" title="Clear search"></button>
      </div>
    </div>

    <div id="cmdbar"></div>

    <div id="body">
      <div id="navpane"></div>
      <div id="navResizer"></div>
      <div id="contentWrap">
        <div id="content" tabindex="0"></div>
        <div id="detailsPane"></div>
        <div id="previewPane"></div>
      </div>
    </div>

    <div id="statusbar">
      <span id="statusText"></span>
      <span id="statusSpacer"></span>
      <span id="statusRight"></span>
    </div>
  </div>

  <div id="progressHost"></div>
  <div id="toast"></div>

  <script src="shared/core.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/util.js"></script>
  <script src="js/state.js"></script>
  <script src="js/actions.js"></script>
  <script src="js/menus.js"></script>
  <script src="js/render.js"></script>
  <script src="js/special.js"></script>
  <script src="js/navpane.js"></script>
  <script src="js/toolbar.js"></script>
  <script src="js/dialogs.js"></script>
  <script src="js/ops.js"></script>
  <script src="js/dnd.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
